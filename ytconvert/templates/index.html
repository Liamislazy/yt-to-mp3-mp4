<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Convert</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --border: #e2e2e0; --accent: #d93025; --accent-text: #ffffff;
    --track: #ececea; --ok: #1e8e3e; --err: #c5221f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececf0; --muted: #9a9aa2;
      --border: #2e2e33; --accent: #ff5a4e; --accent-text: #141416;
      --track: #2a2a2e; --ok: #5bd17a; --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  form {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: grid; gap: 14px;
  }
  input[type=url], select {
    width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  input[type=url]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 10px 18px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg input:checked + label { background: var(--text); color: var(--bg); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row select { width: auto; flex: 1; min-width: 140px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
    padding: 12px 22px; background: var(--accent); color: var(--accent-text);
  }
  button:disabled { opacity: .55; cursor: default; }
  .formerr { color: var(--err); margin: 0; min-height: 0; }
  .formerr:empty { display: none; }
  #jobs { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 10px; }
  .job {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .job-top { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .job-title { font-weight: 600; overflow-wrap: anywhere; }
  .badge {
    font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px;
    border-radius: 6px; border: 1px solid var(--border); color: var(--muted); flex: none;
  }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .meta.err { color: var(--err); }
  .bar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.indet > span { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .files { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .files a {
    color: var(--ok); font-weight: 600; text-decoration: none; border: 1px solid currentColor;
    border-radius: 8px; padding: 6px 12px; overflow-wrap: anywhere;
  }
  footer { color: var(--muted); font-size: 13px; margin-top: 36px; }
</style>
</head>
<body>
<main>
  <h1>YT Convert</h1>
  <p class="sub">Paste a YouTube link, pick MP3 or MP4, and download.</p>

  <form id="form" autocomplete="off">
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube link">
    <div class="row">
      <div class="seg" role="radiogroup" aria-label="Format">
        <input type="radio" name="format" id="f-mp3" value="mp3" checked><label for="f-mp3">MP3</label>
        <input type="radio" name="format" id="f-mp4" value="mp4"><label for="f-mp4">MP4</label>
      </div>
      <select id="quality" aria-label="Quality"></select>
      <button id="go" type="submit">Convert</button>
    </div>
    <p id="formerr" class="formerr" role="alert"></p>
  </form>

  <ul id="jobs" aria-live="polite"></ul>

  <footer>Files are also saved to the <code>downloads</code> folder next to the app. Only download content you have the right to.</footer>
</main>

<script>
const QUALITY = {
  mp3: [["320", "320 kbps"], ["256", "256 kbps"], ["192", "192 kbps", true], ["128", "128 kbps"]],
  mp4: [["best", "Best available", true], ["2160", "Up to 4K"], ["1440", "Up to 1440p"],
        ["1080", "Up to 1080p"], ["720", "Up to 720p"], ["480", "Up to 480p"], ["360", "Up to 360p"]],
};
const $ = (s) => document.querySelector(s);
const form = $("#form"), urlIn = $("#url"), qualSel = $("#quality"), jobsEl = $("#jobs"), err = $("#formerr");

function fmt() { return document.querySelector('input[name=format]:checked').value; }
function fillQuality() {
  qualSel.innerHTML = "";
  for (const [v, label, def] of QUALITY[fmt()]) {
    const o = new Option(label, v, def, def);
    qualSel.add(o);
  }
}
document.querySelectorAll('input[name=format]').forEach((r) => r.addEventListener("change", fillQuality));
fillQuality();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const btn = $("#go");
  btn.disabled = true;
  try {
    const res = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: urlIn.value.trim(), format: fmt(), quality: qualSel.value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    addJob(data.id, urlIn.value.trim(), fmt());
    urlIn.value = "";
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    urlIn.focus();
  }
});

function addJob(id, url, format) {
  const li = document.createElement("li");
  li.className = "job";
  li.innerHTML = `
    <div class="job-top"><span class="job-title"></span><span class="badge">${format.toUpperCase()}</span></div>
    <div class="meta">Queued</div>
    <div class="bar indet"><span></span></div>
    <div class="files"></div>`;
  li.querySelector(".job-title").textContent = url;
  jobsEl.prepend(li);
  poll(id, li);
}

async function poll(id, li) {
  let job;
  try {
    const res = await fetch(`/api/jobs/${id}`);
    job = await res.json();
  } catch { setTimeout(() => poll(id, li), 1500); return; }

  const meta = li.querySelector(".meta"), bar = li.querySelector(".bar"), fill = bar.firstElementChild;
  if (job.title) li.querySelector(".job-title").textContent = job.title;

  if (job.status === "error") {
    bar.remove();
    meta.className = "meta err";
    meta.textContent = job.error || "Failed";
    return;
  }
  if (job.status === "done") {
    bar.remove();
    meta.textContent = "Ready";
    const box = li.querySelector(".files");
    for (const f of job.files) {
      const a = document.createElement("a");
      a.href = f.url; a.textContent = "Download " + f.name; a.setAttribute("download", "");
      box.append(a);
    }
    return;
  }

  const pct = job.percent;
  if (job.stage === "downloading" && pct != null) {
    bar.classList.remove("indet");
    fill.style.width = pct.toFixed(1) + "%";
    meta.textContent = `Downloading ${pct.toFixed(0)}%`;
  } else {
    bar.classList.add("indet");
    fill.style.width = "";
    meta.textContent = job.stage === "converting" ? "Converting…" : (job.status === "queued" ? "Queued" : "Starting…");
  }
  setTimeout(() => poll(id, li), 800);
}
</script>
</body>
</html>
